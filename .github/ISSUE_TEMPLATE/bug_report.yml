name: Bug Report
description: Report a bug or unexpected behavior in the template
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the sections below to help us investigate.

        This repository is a template you fork and customize. If the problem is in code you
        added to your own fork, we may not be able to help — but if the template itself is
        broken, or a documented command does not work, we want to know.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the template is affected?
      options:
        - Workflow or activity template code
        - Worker bootstrap or configuration
        - Local development stack (compose, mock agent)
        - Docker image or build
        - Tests
        - Documentation
        - Development commands (justfile)
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior, starting from a fresh clone where possible.
      placeholder: |
        1. Clone the template and run `just setup`
        2. Run `just start`
        3. Observe error Z in `just logs`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages or stack traces if applicable.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant environment details.
      placeholder: |
        - Template version or commit:
        - Python version:
        - Temporal server version, and how you are running it:
        - Docker version (if relevant):
        - OS:
        - Other relevant info:
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or logs that may help.
    validations:
      required: false
